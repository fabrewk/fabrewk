[package]
name = "fabrewk"
description = "The fabrewk command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fabrewk-core = { path = "../core" }
fabrewk-adapter-claude = { path = "../adapter-claude" }
fabrewk-adapter-codex = { path = "../adapter-codex" }
fabrewk-install = { path = "../install" }

[target.'cfg(target_os = "linux")'.dependencies]
fabrewk-confine-bwrap = { path = "../confine-bwrap" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[features]
# The core's crash-suite seam, for the write commands' fault tests (core-specification 11.2 rule 8); never in a
# release build.
fault-injection = ["fabrewk-core/fault-injection"]

[[test]]
name = "faults"
required-features = ["fabrewk-core/fault-injection"]

[[test]]
name = "crash"
required-features = ["fabrewk-core/fault-injection"]
