[warning]
about = "The publication warning, shown when the maintainers will not publish .brewstillery/ (drafted by Codex in part 10a; the maestro decides the final text)"
title = "Record kept on one computer"
text = """
With `unpublished`, the record stays on this computer only.
Other collaborators cannot see the record or continue the work.
The maintainers accept these consequences at their own risk and responsibility.

The first alternative is to publish `.brewstillery/` with the product (`published`).
As a last resort, `.brewstillery/` can have its own repository (`own-repository`).

The maintainers' answer is recorded in their own words.
"""
