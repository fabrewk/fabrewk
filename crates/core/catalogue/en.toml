# Fabrewk's messages in English, the canonical catalogue (REQ-CLI-2; part 7d2). Every table of messages has its
# description in `about`. Placeholders are {name}. A command appears only in a `run` field, whole; no other text
# holds one, so that every command printed is one a test parses and checks in fish and in a POSIX shell.

[ui]
about = "Labels of the lines that a refusal, a finding or a reading command prints"
where = "Where"
detail = "Detail"
next = "Next step"
next-steps = "Next steps"

[usage]
about = "Usage errors: a command line the declaration of commands does not accept (exit 2)"
command = "There is no command named {word}."
flag = "The option {word} is not one this command takes."
value = "The option {word} takes no value."
extra = "The argument {word} is one more than this command takes."
none = "No command was given."
utf8 = "An argument is not valid UTF-8 text."
id = "No stage or task in the record has the identifier {word}."
missing = "The option {word} takes a value."
repeat = "The option {word} is given more than once."
tag = "The language tag {word} is not a valid BCP 47 tag."
argument = "The command needs its argument {word}."
needed = "The command needs the option {word}."
stage = "The identifier {word} is a stage's; this command takes a task's."
task = "The identifier {word} is a task's; this command takes a stage's."
next = "See what the command takes:"
choice = "The value given is not one this option takes ({word})."
tool = "There is no built-in tool by that name ({word})."
lang = "There is no catalogue for that language ({word})."
unbuilt = "The command {word} is declared but not built yet in this version: it reads and writes nothing."

[internal]
about = "Internal errors (exit 70): something failed that no refusal names"
io = "Fabrewk stopped on an internal error: it could not read or write {path}. This command writes nothing, so nothing changed."
panic = "Fabrewk stopped on an internal error. This command writes nothing, so nothing changed."
missing = "(a message the catalogue lacks)"
io-write = "Fabrewk stopped on an internal error: it could not read or write {path}. What it wrote before stays in the record, and verifying the repository shows what the record holds."
panic-write = "Fabrewk stopped on an internal error. What it wrote before stays in the record, and verifying the repository shows what the record holds."

[help]
about = "Words of the help that --help prints"
intro = "Fabrewk coordinates the development of a project from its record, kept in .brewstillery/."
usage = "Usage"
commands = "Commands"
options = "Options"
argument = "Argument"
refusals = "Refusals"
command-word = "command"
format = "The file's format"

[flag]
about = "What each option does"
help = "Shows this help."
version = "Shows Fabrewk's version."
json = "Gives the output as one JSON document with a schema field."
say = "Your own words for this decision, kept verbatim and signed. Words copied from an example, such as “I agree.”, are refused."
say-lang = "The language tag of your words; by default, your languages.agentInteraction."
widen = "Names a widening of authority this move makes, by its key path; give it once for each."
seen = "The digest that status printed of what you read; if the subject changed since, the move is refused."
then-run = "Starts the run in the same command, after the authorization."
answer = "The JSON file with the integrator's answer; its format is below."
mode = "adopt, for Fabrewk to administer the repository, or review, to only review it; by default, adopt."
publication = "Whether the maintainers publish .brewstillery/: published (with the product), own-repository (a repository of its own) or unpublished."
alias = "The first maestro's alias: lowercase letters and digits, words joined by a hyphen."
key = "The file that holds the first maestro's one OpenSSH public key, the one Git signs with."
tool = "A built-in tool to declare, by name; give it once for each."
lang = "The project's canonical documentation language and the first maestro's language, as a language tag; by default, en."
purpose = "The first alambique's answer: what the project must achieve, written as given."
audience = "The first alambique's answer: for whom the project is, written as given."
excluded = "The first alambique's answer: what the project leaves out, written as given."

[command.status]
about = "The command that shows the state"
summary = "Shows the record's health, the policy in force and the state of each stage and task."
arg = "A stage or a task, by its identifier (s-… or t-…): shows it with its events."

[command.config]
about = "The command that shows the effective configuration"
summary = "Shows every effective setting with its source, the changes not adopted, the keys, what this machine has and every control."
arg = "One setting, by its key path: shows only its value and source."

[command.check]
about = "The command that verifies the repository"
summary = "Verifies the settings, the policy, the record, the domain, the credentials and the private folder."

[command.assess]
about = "The command that assesses a repository before Fabrewk enters it"
summary = "Assesses this repository, writing nothing: the verdict with its reasons, and the plan of what Fabrewk would write, with its digest."

[command.apply]
about = "The command that applies a plan assess printed"
summary = "A maestro applies the plan assess printed, with the same options and their own words."
arg = "The digest of the plan assess printed."

[command.adopt]
about = "The command that adopts the project file as the policy in force"
summary = "A maestro adopts the project file as the policy in force, naming every widening it makes."

[command.propose]
about = "The command that proposes a stage and its tasks"
summary = "Proposes a stage and its tasks, or tasks for a stage of the record, from a JSON file; it authorizes nothing."
arg = "The JSON file that describes the stage and its tasks; its format is below."

[command.authorize]
about = "The command that authorizes a task or a stage"
summary = "A maestro authorizes a task, or a stage and its tasks, as status showed it, naming every widening it makes."
arg = "The task or the stage, by its identifier (t-… or s-…)."

[command.accept]
about = "The command that accepts a task and integrates it"
summary = "A maestro accepts a task's candidate as status showed it, and Fabrewk integrates it into the record branch."
arg = "The task, by its identifier (t-…)."

[command.reject]
about = "The command that rejects a task"
summary = "A maestro rejects a task, saying why."
arg = "The task, by its identifier (t-…)."

[command.run]
about = "The command that starts a task's run"
summary = "A maestro starts the confined run of an authorized task, or of a stage's next one, or finishes the integration of an accepted task."
arg = "The task or the stage, by its identifier (t-… or s-…)."

[command.close]
about = "The command that closes a stage"
summary = "A maestro closes an authorized stage once every task has ended, every fermento was swept after the last of them, the alambique is as last approved and the record is committed."
arg = "The stage, by its identifier (s-…)."

[words]
about = "The example of words that help prints; given as --say, it is refused (WORDS_COPIED)"
example = "I agree."

[format]
about = "Words of the format of propose's file"
stage = "stage: an object with these fields, or the identifier (s-…) of a stage of the record"
tasks = "tasks: a list of one task or more, each an object with these fields"
name = "a name for the task, which a later task of the file may give among its dependencies"
optional = "(optional)"
answer = "The answer file: an object with these fields"
answer-note = "An edit's unit is the opening (kind opening), a section (kind section, n), a point (kind point, n and m) or a rule (kind rule, n; a text of null removes it); target is alambique or rules, and a rules edit holds rule units only."

[type]
about = "The types of the fields of propose's file; {of} is the type a list or a map holds"
text = "text"
tag = "a language tag (BCP 47)"
count = "a whole number, 1 or more"
bool = "true or false"
hex = "hexadecimal digits"
stage-id = "a stage's identifier (s-…)"
task-id = "a task's identifier (t-…), or the name of a task above it in the file"
base = "a commit (40 or 64 hexadecimal digits), or null"
value = "a setting's value"
object = "an object with these fields"
list = "a list, each item {of}"
map = "an object whose fields each hold {of}"
nullable = "{of}, or null"
proposal-id = "a proposal's identifier (p-…)"

[adopt]
about = "What adopt reports"
done = "The project file is now the policy in force (digest {digest}). Its changes against the policy it replaces:"
unchanged = "none: it holds what the policy in force held."

[propose]
about = "What propose reports"
stage = "Proposed the stage {id}: {goal}"
added = "Added to the stage {id}: {goal}"
task = "Proposed the task {id}: {goal}"
grants = "Nothing is authorized: a maestro reads each one and decides."

[bind]
