# The refusal codes the core raises (section 7): what each means, its reason and its next step.

[code.AGENT_ENVIRONMENT]
about = "A person's move run where the environment shows an agent's or an extension's markers (REQ-TASK-4, REQ-SEC-7)"
reason = "This runs inside an agent or an extension, whose markers are in the environment, and only a person makes this move. The check is cooperative: a process can clear its environment."
next = "Run the command yourself, in your own terminal."

[code.ALIAS_INVALID]
about = "A maintainer's alias, or a directory at the domain's top, that is not a valid alias"
reason = "A name that is not a valid alias: lowercase letters, digits and single hyphens, starting with a letter, at most 32 characters, and not a reserved name."
next = "Rename it to a valid alias."

[code.ALIAS_MISMATCH]
about = "A personal file whose maintainer.alias is not its directory's name"
reason = "The personal file names another maintainer than its directory."
next = "Make maintainer.alias equal to the name of the file's directory."

[code.ATTEMPT_ENDED]
about = "An attempt ended twice, or ended without starting"
reason = "The record ends an attempt that is not open."
next = "A person examines the event named; Fabrewk never repairs the record."
run = "fabrewk check"

[code.CHECK_DUPLICATE]
about = "A check defined differently by a stage and by the project"
reason = "One check has two different definitions."
next = "Keep one definition of the check, in the stage or in the project."

[code.CHECK_UNKNOWN]
about = "A verification that could not run"
reason = "A verification could not run, so its result is unknown, and an unknown result is never a pass."
next = "Install or repair what is named, then verify again."
run = "fabrewk check"

[code.CONFINEMENT_UNAVAILABLE]
about = "A run with no confinement backend, or one whose preflight fails (REQ-SEC-2)"
reason = "No agent runs unconfined, and this machine or this version has no confinement to give it."
next = "Run it where Fabrewk has a confinement backend; the detail says what is missing."

[code.CREDENTIAL_SUSPECTED]
about = "A file that looks like a credential"
reason = "A file looks like a credential. The match is a heuristic, a cooperative control."
next = "Remove the credential from the domain, and replace it if it was ever committed or shared."

[code.DEPENDENCY_OPEN]
about = "A run of a task whose dependencies are not integrated (REQ-TASK-3)"
reason = "A task it depends on is not integrated yet."
next = "Bring that task to its end first:"
run = "fabrewk status"

[code.DOMAIN_NOT_IGNORED]
about = "A domain that the product's repository would publish, in a mode that must not publish it"
reason = "The product's repository does not ignore .brewstillery/, so a commit there would publish it."
next = "Add the line /.brewstillery/ to the product's .git/info/exclude."

[code.DOMAIN_UNKNOWN_ENTRY]
about = "An entry at the domain's top that is not part of it (a warning)"
reason = "An entry in .brewstillery/ that is not part of Fabrewk's domain; it was left as it is."
next = "Move it out of .brewstillery/ if it is not Fabrewk's."

[code.GITIGNORE_CHANGED]
about = "The domain's ignore file differs from what Fabrewk writes"
reason = "The file .brewstillery/.gitignore differs from what Fabrewk writes."
next = "Restore it to the single line local/."

[code.HEAD_DETACHED]
about = "A repository whose checked-out head is not a branch"
reason = "Git's head names no branch, so there is no record branch."
next = "Check out the branch that holds the record, then run the command again."

[code.KEY_UNKNOWN]
about = "fabrewk config was given a key path that no setting declares"
reason = "No setting is declared at this key path."
next = "See every setting and its key path:"
run = "fabrewk config"

[code.LIMIT_UNOBSERVABLE]
about = "A token limit on a profile whose tool reports no tokens"
reason = "A token limit is set for a tool that does not report the tokens it uses, so the limit could not be kept."
next = "Remove the token limit, or use a profile whose tool reports tokens."

[code.LOCK_HELD]
about = "Another Fabrewk command is writing in this repository"
reason = "Another Fabrewk command holds the lock of this repository's record, or another task is running: one writer and one run at a time."
next = "Wait until it ends, then run your command again."

[code.MARK_INVALID]
about = "This machine's mark of the record's heads is damaged"
reason = "This machine's mark of the record (local/cache/heads.json) is damaged or names an event the record does not hold there."
next = "A person examines the mark and removes it if it is damaged; Fabrewk never removes it."

[code.MERGE_IN_PROGRESS]
about = "A rejection while an acceptance of the task's current candidate is on record (REQ-GATE-8)"
reason = "The task's current candidate is accepted, and its integration may be halfway done."
next = "Finish the integration, or see where the task is:"
run = "fabrewk status"

[code.MOVE_NOT_ALLOWED]
about = "A move the transition table does not allow from the subject's state"
reason = "The transition table does not allow this move from the subject's state."
next = "See the subject's state and the moves it allows:"
run = "fabrewk status"

[code.NOT_A_REPOSITORY]
about = "A command run outside the root of a repository's main working tree"
reason = "This is not the root of the repository's main working tree."
next = "Run it at the root of the repository's main working tree."

[code.POLICY_ABSENT]
about = "No policy is adopted"
reason = "No policy is adopted, so there is no effective configuration and no maintainer."
next = "A maestro adopts the project file; installing Fabrewk does it first."

[code.POLICY_PENDING]
about = "The project file differs from the adopted policy (a warning)"
reason = "The project file has changes that no maestro has adopted; the policy in force is still the adopted one."
next = "See the changes and what each does to authority:"
run = "fabrewk config"

[code.POLICY_UNCOMMITTED]
about = "A project file adopted while not committed, in a mode that commits"
reason = "The project file is not as committed at the record branch's head."
next = "Commit .brewstillery/settings.toml, then adopt it."
run = "fabrewk adopt"

[code.PRIVATE_FOLDER_PERMISSIONS]
about = "A private folder whose permissions give access to others"
reason = "The private folder gives access to someone other than its owner, so Fabrewk does not read it."
next = "Give the folder to its owner only (mode 0700)."

[code.PROTECTED_PATH]
about = "A task's allowed files that reach a protected path"
reason = "The allowed files reach a protected path."
next = "Narrow the allowed files so that they reach no protected path."

[code.PROTECTED_PATH_WILDCARD]
about = "A wildcard among the allowed files that matches a protected path"
reason = "A wildcard among the allowed files matches a protected path."
next = "List the protected file literally, or narrow the wildcard."

[code.RECORD_ABSENT]
about = "No record: Fabrewk is not installed here"
reason = "There is no record here."
next = "Run it at the root of a repository where Fabrewk is installed."

[code.RECORD_BROKEN]
about = "The record's files are not a chain: a gap, a wrong link, a file out of place"
reason = "The record is broken: its files are not one unbroken chain."
next = "A person examines the file named and restores it from the history; Fabrewk never repairs the record."

[code.RECORD_COMMIT_RACE]
about = "The branch moved during a write command and changed a file of its commit"
reason = "The branch moved while Fabrewk committed the record; its events are written but not committed."
next = "The next write command commits them."

[code.RECORD_DIGEST_MISMATCH]
about = "An event file whose name and content differ"
reason = "An event file's content is not the one its name records."
next = "A person examines the file named and restores it from the history."

[code.RECORD_FORK]
about = "Two events at one place of a stream, from two clones"
reason = "Two events stand at the same place of one stream: two clones wrote there."
next = "A person decides which line of events stays, and restores it from the history."

[code.RECORD_HEAD_MOVED]
about = "A stream's head moved under the lock; nothing was written"
reason = "Something wrote in the record without its lock while this command ran; this command wrote nothing."
next = "Run the command again."

[code.RECORD_ID_COLLISION]
about = "Two stages or tasks share an identifier"
reason = "Two stages or two tasks were given the same identifier."
next = "A person examines the stream named."

[code.RECORD_NONCANONICAL]
about = "An event file not in canonical form"
reason = "An event file is not in canonical form, so its digest cannot be trusted."
next = "A person examines the file named and restores it from the history."

[code.RECORD_ROLLBACK]
about = "The record lost events it held before"
reason = "The record lost events it held before: a rollback."
next = "A person restores the lost events from the history or from another clone."

[code.RECORD_SIGNATURE_INVALID]
about = "A person's event whose signature does not verify against the policy"
reason = "A person's event is not signed by the key and role the policy gives its signer."
next = "A person examines the event named; an event nobody signed is not theirs."

[code.RECORD_TRANSITION_INVALID]
about = "An event the transition table does not allow where it stands"
reason = "An event stands where the transition table does not allow it."
next = "A person examines the event named."
run = "fabrewk check"

[code.RECORD_UNCOMMITTED]
about = "The record's files are written but not committed"
reason = "Some of the record's files are not committed on the record branch."
next = "The next write command commits them."

[code.RECORD_VERSION_UNKNOWN]
about = "An event of a schema this Fabrewk does not know"
reason = "An event is not of a schema this version of Fabrewk knows."
next = "Use a version of Fabrewk that knows it, or examine the file named."

[code.ROLE_FORBIDDEN]
about = "A move by a key with no role, or with a role that may not make it"
reason = "The key signing this move holds no role in the policy that may make it."
next = "A maestro makes this move with their own key."

[code.ROLE_NOT_ENFORCED]
about = "A policy that lists a supervisor, a role not enforced yet"
reason = "The policy lists a supervisor, a role Fabrewk does not enforce yet."
next = "Give that maintainer the role of maestro or contributor."

[code.SETTINGS_INVALID]
about = "A settings file that does not read or validate"
reason = "A settings file does not read or validate."
next = "Correct the file at the key path and line named."

[code.SETTINGS_KEY_NOT_PERSONAL]
about = "A personal file holding a key that is not personal"
reason = "A personal file holds a key that only the project file may set."
next = "Move the key to the project file, where a maestro adopts it."

[code.STAGE_OPEN_TASKS]
about = "A stage closed while a task of it is still open (REQ-TASK-6)"
reason = "A task of the stage has not ended: it is neither integrated nor rejected."
next = "See the stage and its tasks:"
run = "fabrewk status"

[code.SWEEP_MISSING]
about = "A stage closed before every maintainer's fermento was swept after its last task (REQ-TASK-6)"
reason = "A maintainer's fermento was not swept after the last task of the stage ended."
next = "The integrator sweeps each fermento named, with the sweep command; see where things stand:"
run = "fabrewk status"

[code.VIEW_STALE]
about = "STATUS.md or RULES.md differs from a fresh generation (REQ-VIEW-3, C5)"
reason = "A generated view differs from what the record gives, or is absent: it was changed by hand."
next = "The next command that writes regenerates it; to see what differs, compare it with its Git version."

[code.STAGE_CLOSED]
about = "A task proposed into a stage that is closed (section 4)"
reason = "The stage is closed, so no task can be added to it."
next = "Propose the tasks in a new stage."

[code.TASK_CHANGED]
about = "A task changed after it was shown for authorization"
reason = "The task, or its stream's head, changed after it was shown."
next = "See the task as it is now:"
run = "fabrewk status"

[code.TASK_INVALID]
about = "A stage or task whose fields are not valid"
reason = "A stage's or a task's fields are not valid."
next = "Correct the field named."

[code.TOOL_FAILED]
about = "An external tool failed"
reason = "An external tool failed; what it printed is kept as evidence, never shown here."
next = "Repair what is named, then run the command again."

[code.TOOL_MISSING]
about = "An external tool is not on this machine"
reason = "A tool this needs is not on this machine."
next = "Install the tool named, or declare where it is."

[code.WIDENING_UNNAMED]
about = "A change that widens authority, not named with --widen"
reason = "A change widens authority without being named."
next = "A maestro names each widening, by its key path, when making the move."

[code.WORDS_COPIED]
about = "A person's words that are the catalogue's example (REQ-TASK-4)"
reason = "The words given are the example that help prints, not your own."
next = "Write your own words for this decision with --say."

[code.WORDS_MISSING]
about = "A person's move without words: none given, empty, or not UTF-8 (REQ-TASK-4)"
reason = "A person's move needs your own words, given with --say: not empty, and valid UTF-8 text."
next = "Say with --say, in your own words, why you decide it."

