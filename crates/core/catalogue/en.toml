title = "What an authorization binds, as the record holds it:"
task = "Task {id}, of the stage {stage}; the digest of its fields: {digest}"
stage = "Stage {id}; the digest of its fields: {digest}"
head = "Its stream's head: event {seq}, {digest}"
goal = "Goal"
requirements = "Requirements"
criterion = "Criterion"
base = "Base commit"
dependencies = "Depends on"
allowed = "Allowed files"
profiles = "Profiles: {build} to build, {review} to review"
checks = "Checks"
limits = "Limits"
budget = "Budget"
delegation = "Language of the delegation"
settings = "Settings"
tasks = "The tasks it authorizes:"
none = "none"
digest = "The digest of what is shown above, which authorize takes with --seen: {digest}"

[limit]
