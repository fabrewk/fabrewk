[help]
intro = "Fabrewk coordina el desarrollo de un proyecto a partir de su registro, guardado en .brewstillery/."
usage = "Uso"
commands = "Comandos"
options = "Opciones"
argument = "Argumento"
refusals = "Rechazos"
command-word = "comando"
format = "El formato del archivo"

[flag]
help = "Muestra esta ayuda."
version = "Muestra la versión de Fabrewk."
json = "Da la salida como un solo documento JSON con un campo schema."
say = "Tus propias palabras para esta decisión, guardadas tal cual y firmadas. Se rechazan las copiadas de un ejemplo, como «Estoy de acuerdo.»."
say-lang = "La etiqueta de idioma de tus palabras; por omisión, tu languages.agentInteraction."
widen = "Nombra una ampliación de autoridad que hace este movimiento, por su ruta de clave; una vez por cada una."
seen = "El digest que status imprimió de lo que leíste; si el sujeto cambió desde entonces, el movimiento se niega."
then-run = "Inicia la ejecución en el mismo comando, después de la autorización."
answer = "El archivo JSON con la respuesta del integrador; su formato va abajo."

[command.status]
summary = "Muestra la salud del registro, la política vigente y el estado de cada etapa y tarea."
arg = "Una etapa o una tarea, por su identificador (s-… o t-…): la muestra con sus eventos."

[command.config]
summary = "Muestra cada ajuste efectivo con su origen, los cambios no adoptados, las llaves, lo que tiene este equipo y cada control."
arg = "Un solo ajuste, por su ruta de clave: muestra solo su valor y su origen."

[command.check]
summary = "Verifica los ajustes, la política, el registro, el dominio, las credenciales y la carpeta privada."

[command.adopt]
summary = "Un maestro adopta el archivo del proyecto como la política vigente, nombrando cada ampliación que hace."

[command.propose]
summary = "Propone una etapa y sus tareas, o tareas para una etapa del registro, desde un archivo JSON; no autoriza nada."
arg = "El archivo JSON que describe la etapa y sus tareas; su formato va abajo."

[command.authorize]
summary = "Un maestro autoriza una tarea, o una etapa y sus tareas, tal como status las mostró, nombrando cada ampliación que hace."
arg = "La tarea o la etapa, por su identificador (t-… o s-…)."

[command.reject]
summary = "Un maestro rechaza una tarea y dice por qué."
arg = "La tarea, por su identificador (t-…)."

[command.run]
summary = "Un maestro inicia la ejecución confinada de una tarea autorizada, o de la siguiente de una etapa; esta versión aún no tiene confinamiento, así que se niega."
arg = "La tarea o la etapa, por su identificador (t-… o s-…)."

[command.close]
summary = "Un maestro cierra una etapa autorizada cuando todas sus tareas terminaron, cada fermento se barrió después de la última, el alambique es el aprobado por última vez y el registro está confirmado."
arg = "La etapa, por su identificador (s-…)."

[words]
example = "Estoy de acuerdo."

[format]
