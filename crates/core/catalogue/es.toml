sweep-recorded = "barrido registrado"
proposal-recorded = "propuesta registrada"
proposal-withdrawn = "propuesta retirada"
proposal-discarded = "propuesta descartada"
stage-proposed = "etapa propuesta"
stage-authorized = "etapa autorizada"
stage-closed = "etapa cerrada"
task-proposed = "tarea propuesta"
task-authorized = "tarea autorizada"
