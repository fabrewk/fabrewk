[internal]
io = "Fabrewk se detuvo por un error interno: no pudo leer ni escribir {path}. Este comando no escribe nada, así que nada cambió."
panic = "Fabrewk se detuvo por un error interno. Este comando no escribe nada, así que nada cambió."
missing = "(un mensaje que falta en el catálogo)"
io-write = "Fabrewk se detuvo por un error interno: no pudo leer ni escribir {path}. Lo que escribió antes queda en el registro, y verificar el repositorio muestra lo que contiene."
panic-write = "Fabrewk se detuvo por un error interno. Lo que escribió antes queda en el registro, y verificar el repositorio muestra lo que contiene."

[help]
intro = "Fabrewk coordina el desarrollo de un proyecto a partir de su registro, guardado en .brewstillery/."
usage = "Uso"
commands = "Comandos"
options = "Opciones"
argument = "Argumento"
refusals = "Rechazos"
command-word = "comando"
format = "El formato del archivo"

[flag]
help = "Muestra esta ayuda."
version = "Muestra la versión de Fabrewk."
json = "Da la salida como un solo documento JSON con un campo schema."
say = "Tus propias palabras para esta decisión, guardadas tal cual y firmadas. Se rechazan las copiadas de un ejemplo, como «Estoy de acuerdo.»."
say-lang = "La etiqueta de idioma de tus palabras; por omisión, tu languages.agentInteraction."
widen = "Nombra una ampliación de autoridad que hace este movimiento, por su ruta de clave; una vez por cada una."
seen = "El digest que status imprimió de lo que leíste; si el sujeto cambió desde entonces, el movimiento se niega."
then-run = "Inicia la ejecución en el mismo comando, después de la autorización."
report = "Reporta terminado el corte en curso, para la auditoría del maestro; sin ella, el corte se abre."
answer = "El archivo JSON con la respuesta del integrador; su formato va abajo."
mode = "adopt, para que Fabrewk administre el repositorio, o review, para solo revisarlo; por omisión, adopt."
publication = "Si los mantenedores publican .brewstillery/: published (con el producto), own-repository (un repositorio propio) o unpublished."
alias = "El alias del primer maestro: minúsculas y dígitos, palabras unidas por un guion."
key = "El archivo con la única llave pública OpenSSH del primer maestro, la que usa Git para firmar."
tool = "Una herramienta integrada que declarar, por su nombre; una vez por cada una."
lang = "El idioma canónico de la documentación del proyecto y el del primer maestro, como etiqueta de idioma; por omisión, en."
purpose = "La respuesta del primer alambique: qué debe lograr el proyecto, escrita tal cual."
audience = "La respuesta del primer alambique: para quién es el proyecto, escrita tal cual."
excluded = "La respuesta del primer alambique: qué deja fuera el proyecto, escrita tal cual."

[command.status]
summary = "Muestra la salud del registro, la política vigente y el estado de cada etapa y tarea."
arg = "Una etapa o una tarea, por su identificador (s-… o t-…): la muestra con sus eventos."

[command.config]
summary = "Muestra cada ajuste efectivo con su origen, los cambios no adoptados, las llaves, lo que tiene este equipo y cada control."
arg = "Un solo ajuste, por su ruta de clave: muestra solo su valor y su origen."

[command.check]
summary = "Verifica los ajustes, la política, el registro, el dominio, las credenciales y la carpeta privada."

[command.assess]
summary = "Evalúa este repositorio sin escribir nada: el dictamen con sus razones y el plan de lo que Fabrewk escribiría, con su digest."

[command.apply]
summary = "Un maestro aplica el plan que imprimió assess, con las mismas opciones y sus propias palabras."
arg = "El digest del plan que imprimió assess."

[command.onboard]
summary = "Hace en la terminal las preguntas de la instalación, muestra el plan y lo aplica con el sí explícito de la persona y sus propias palabras."

[command.adopt]
summary = "Un maestro adopta el archivo del proyecto como la política vigente, nombrando cada ampliación que hace."

[command.propose]
summary = "Propone una etapa y sus tareas, o tareas para una etapa del registro, desde un archivo JSON; no autoriza nada."
arg = "El archivo JSON que describe la etapa y sus tareas; su formato va abajo."

[command.authorize]
summary = "Un maestro autoriza una tarea, o una etapa y sus tareas, tal como status las mostró, nombrando cada ampliación que hace."
arg = "La tarea o la etapa, por su identificador (t-… o s-…)."

[command.accept]
summary = "Un maestro acepta el candidato de una tarea tal como lo mostró status, y Fabrewk lo integra en la rama del registro."
arg = "La tarea, por su identificador (t-…)."

[command.reject]
summary = "Un maestro rechaza una tarea y dice por qué."
arg = "La tarea, por su identificador (t-…)."

[command.run]
summary = "Un maestro inicia la ejecución confinada de una tarea autorizada, o de la siguiente de una etapa, o termina la integración de una tarea aceptada."
arg = "La tarea o la etapa, por su identificador (t-… o s-…)."

[command.close]
summary = "Un maestro cierra una etapa autorizada cuando todas sus tareas terminaron, cada fermento se barrió después de la última, el alambique es el aprobado por última vez y el registro está confirmado."
arg = "La etapa, por su identificador (s-…)."

[words]
example = "Estoy de acuerdo."

[format]
stage = "stage: un objeto con estos campos, o el identificador (s-…) de una etapa del registro"
