# Los mensajes de Fabrewk en español (REQ-CLI-2; parte 7d2). Las descripciones de cada tabla están en el catálogo
# canónico, en.toml. Los marcadores son {nombre}. Un comando aparece solo en un campo `run`, completo.

[ui]
where = "Dónde"
detail = "Detalle"
next = "Siguiente paso"
