[code.ALIAS_INVALID]
reason = "Un nombre que no es un alias válido: minúsculas, dígitos y guiones sueltos, empezando con una letra, de 32 caracteres a lo más, y que no sea un nombre reservado."
next = "Renómbralo a un alias válido."

[code.ALIAS_MISMATCH]
reason = "El archivo personal nombra a otro mantenedor que su directorio."
next = "Haz que maintainer.alias sea igual al nombre del directorio del archivo."

[code.ATTEMPT_ENDED]
reason = "El registro termina un intento que no está abierto."
next = "Una persona examina el evento indicado; Fabrewk nunca repara el registro."
run = "fabrewk check"

[code.CHECK_DUPLICATE]
reason = "Una comprobación tiene dos definiciones distintas."
next = "Deja una sola definición de la comprobación, en la etapa o en el proyecto."

[code.CHECK_UNKNOWN]
reason = "Una verificación no pudo correr, así que su resultado es desconocido, y un resultado desconocido nunca es un pase."
next = "Instala o repara lo indicado y verifica de nuevo."
run = "fabrewk check"

[code.CREDENTIAL_SUSPECTED]
reason = "Un archivo parece una credencial. La coincidencia es una heurística, un control cooperativo."
next = "Quita la credencial del dominio, y reemplázala si alguna vez se confirmó o se compartió."

[code.DOMAIN_NOT_IGNORED]
reason = "El repositorio del producto no ignora .brewstillery/, así que un commit ahí lo publicaría."
next = "Agrega la línea /.brewstillery/ al .git/info/exclude del producto."

[code.DOMAIN_UNKNOWN_ENTRY]
reason = "Una entrada en .brewstillery/ que no es parte del dominio de Fabrewk; se dejó como está."
next = "Sácala de .brewstillery/ si no es de Fabrewk."

[code.GITIGNORE_CHANGED]
reason = "El archivo .brewstillery/.gitignore difiere de lo que Fabrewk escribe."
next = "Restáuralo a la sola línea local/."

[code.HEAD_DETACHED]
reason = "El head de Git no nombra ninguna rama, así que no hay rama del registro."
next = "Cambia a la rama que guarda el registro y corre el comando de nuevo."

[code.KEY_UNKNOWN]
reason = "Ningún ajuste está declarado en esta ruta de clave."
next = "Consulta cada ajuste y su ruta de clave:"
run = "fabrewk config"

[code.LIMIT_UNOBSERVABLE]
reason = "Hay un límite de tokens para una herramienta que no informa los tokens que usa, así que el límite no se podría cumplir."
next = "Quita el límite de tokens, o usa un perfil cuya herramienta informe tokens."

[code.LOCK_HELD]
reason = "Otro comando de Fabrewk tiene el candado del registro de este repositorio."
next = "Espera a que termine y corre tu comando de nuevo."

[code.MARK_INVALID]
reason = "La marca del registro de este equipo (local/cache/heads.json) está dañada o nombra un evento que el registro no tiene en ese lugar."
next = "Una persona examina la marca y la quita si está dañada; Fabrewk nunca la quita."

[code.MOVE_NOT_ALLOWED]
reason = "La tabla de transiciones no permite este movimiento desde el estado del sujeto."
next = "Consulta el estado del sujeto y los movimientos que permite:"
run = "fabrewk status"

[code.NOT_A_REPOSITORY]
reason = "Esta no es la raíz del árbol de trabajo principal del repositorio."
next = "Córrelo en la raíz del árbol de trabajo principal del repositorio."

[code.POLICY_ABSENT]
reason = "No hay una política adoptada, así que no hay configuración efectiva ni mantenedores."
next = "Un maestro adopta el archivo del proyecto; instalar Fabrewk lo hace primero."

[code.POLICY_PENDING]
reason = "El archivo del proyecto tiene cambios que ningún maestro ha adoptado; la política vigente sigue siendo la adoptada."
next = "Consulta los cambios y lo que cada uno hace a la autoridad:"
run = "fabrewk config"

[code.POLICY_UNCOMMITTED]
reason = "El archivo del proyecto no está como se confirmó en el head de la rama del registro."
next = "Confirma .brewstillery/settings.toml y luego adóptalo."

[code.PRIVATE_FOLDER_PERMISSIONS]
reason = "La carpeta privada da acceso a alguien más que su dueño, así que Fabrewk no la lee."
next = "Deja la carpeta solo para su dueño (modo 0700)."

[code.PROTECTED_PATH]
reason = "Los archivos permitidos alcanzan una ruta protegida."
next = "Reduce los archivos permitidos para que no alcancen ninguna ruta protegida."

[code.PROTECTED_PATH_WILDCARD]
reason = "Un comodín entre los archivos permitidos coincide con una ruta protegida."
next = "Lista el archivo protegido literalmente, o reduce el comodín."

[code.RECORD_ABSENT]
reason = "Aquí no hay registro."
next = "Córrelo en la raíz de un repositorio donde Fabrewk esté instalado."

[code.RECORD_BROKEN]
reason = "El registro está roto: sus archivos no forman una sola cadena sin cortes."
next = "Una persona examina el archivo indicado y lo restaura desde la historia; Fabrewk nunca repara el registro."

[code.RECORD_COMMIT_RACE]
reason = "La rama se movió mientras Fabrewk confirmaba el registro; sus eventos están escritos pero no confirmados."
next = "El siguiente comando que escribe los confirma."

[code.RECORD_DIGEST_MISMATCH]
reason = "El contenido de un archivo de evento no es el que su nombre registra."
next = "Una persona examina el archivo indicado y lo restaura desde la historia."

[code.RECORD_FORK]
reason = "Dos eventos ocupan el mismo lugar de un flujo: dos clones escribieron ahí."
next = "Una persona decide qué línea de eventos se queda y la restaura desde la historia."

[code.RECORD_HEAD_MOVED]
reason = "Algo escribió en el registro sin su candado mientras corría este comando; este comando no escribió nada."
next = "Corre el comando de nuevo."

[code.RECORD_ID_COLLISION]
reason = "Dos etapas o dos tareas recibieron el mismo identificador."
next = "Una persona examina el flujo indicado."

[code.RECORD_NONCANONICAL]
reason = "Un archivo de evento no está en forma canónica, así que no se puede confiar en su resumen."
next = "Una persona examina el archivo indicado y lo restaura desde la historia."

[code.RECORD_ROLLBACK]
reason = "El registro perdió eventos que tenía antes: un retroceso."
next = "Una persona restaura los eventos perdidos desde la historia o desde otro clon."

[code.RECORD_SIGNATURE_INVALID]
reason = "El evento de una persona no está firmado con la llave y el rol que la política da a quien firma."
next = "Una persona examina el evento indicado; un evento que nadie firmó no es de nadie."

[code.RECORD_TRANSITION_INVALID]
reason = "Un evento está donde la tabla de transiciones no lo permite."
next = "Una persona examina el evento indicado."
run = "fabrewk check"

[code.RECORD_UNCOMMITTED]
reason = "Algunos archivos del registro no están confirmados en la rama del registro."
next = "El siguiente comando que escribe los confirma."

[code.RECORD_VERSION_UNKNOWN]
reason = "Un evento no es de un esquema que esta versión de Fabrewk conozca."
next = "Usa una versión de Fabrewk que lo conozca, o examina el archivo indicado."

[code.ROLE_FORBIDDEN]
reason = "La llave que firma este movimiento no tiene en la política ningún rol que pueda hacerlo."
next = "Un maestro hace este movimiento con su propia llave."

[code.ROLE_NOT_ENFORCED]
reason = "La política lista un supervisor, un rol que Fabrewk aún no hace cumplir."
next = "Dale a ese mantenedor el rol de maestro o de colaborador."

[code.SETTINGS_INVALID]
reason = "Un archivo de ajustes no se lee o no valida."
next = "Corrige el archivo en la ruta de clave y la línea indicadas."

[code.SETTINGS_KEY_NOT_PERSONAL]
reason = "Un archivo personal tiene una clave que solo el archivo del proyecto puede fijar."
next = "Mueve la clave al archivo del proyecto, donde un maestro la adopta."

[code.TASK_CHANGED]
reason = "La tarea, o el head de su flujo, cambió después de mostrarse."
next = "Consulta la tarea como está ahora:"
run = "fabrewk status"

[code.TASK_INVALID]
reason = "Los campos de una etapa o de una tarea no son válidos."
next = "Corrige el campo indicado."

[code.TOOL_FAILED]
reason = "Una herramienta externa falló; lo que imprimió se guarda como evidencia y nunca se muestra aquí."
next = "Repara lo indicado y corre el comando de nuevo."

[code.TOOL_MISSING]
reason = "Una herramienta que esto necesita no está en este equipo."
next = "Instala la herramienta indicada, o declara dónde está."

[code.WIDENING_UNNAMED]
reason = "Un cambio amplía la autoridad sin nombrarse."
next = "Un maestro nombra cada ampliación, por su ruta de clave, al hacer el movimiento."
