Este archivo es el alambique del proyecto. Fabrewk nombra sus partes como las de una destilería. Brewstillery, la destilería, es el dominio de Fabrewk en este repositorio: la carpeta .brewstillery/. Ahí, cada maestro prepara un fermento, un archivo propio con lo que quiere agregar, quitar o discutir. Los fermentos se vierten en el alambique, este archivo, para destilar lo que el proyecto debe ser. Solo los maestros aprueban lo que entra en él.
