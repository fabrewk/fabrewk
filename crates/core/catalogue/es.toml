[warning]
title = "Registro en una sola computadora"
text = """
Con `unpublished`, el registro queda solo en esta computadora.
Otros colaboradores no pueden ver el registro ni continuar el trabajo.
Los mantenedores asumen estas consecuencias bajo su propio riesgo y responsabilidad.

La primera alternativa es publicar `.brewstillery/` con el producto (`published`).
Como último recurso, `.brewstillery/` puede tener su propio repositorio (`own-repository`).

La respuesta de los mantenedores se registra con sus propias palabras.
"""

