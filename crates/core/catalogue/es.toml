# Los mensajes de Fabrewk en español (REQ-CLI-2; parte 7d2). Las descripciones de cada tabla están en el catálogo
# canónico, en.toml. Los marcadores son {nombre}. Un comando aparece solo en un campo `run`, completo.

[ui]
where = "Dónde"
detail = "Detalle"
next = "Siguiente paso"
next-steps = "Siguientes pasos"

[usage]
command = "No hay ningún comando llamado {word}."
flag = "Este comando no acepta la opción {word}."
value = "La opción {word} no lleva valor."
extra = "El argumento {word} sobra: este comando no acepta tantos."
none = "No se indicó ningún comando."
utf8 = "Un argumento no es texto UTF-8 válido."
id = "Ninguna etapa ni tarea del registro tiene el identificador {word}."
next = "Consulta qué acepta el comando:"

[internal]
io = "Fabrewk se detuvo por un error interno: no pudo leer ni escribir {path}. Este comando no escribe nada, así que nada cambió."
panic = "Fabrewk se detuvo por un error interno. Este comando no escribe nada, así que nada cambió."
missing = "(un mensaje que falta en el catálogo)"

[help]
intro = "Fabrewk coordina el desarrollo de un proyecto a partir de su registro, guardado en .brewstillery/."
usage = "Uso"
commands = "Comandos"
options = "Opciones"
argument = "Argumento"
refusals = "Rechazos"
command-word = "comando"

[flag]
help = "Muestra esta ayuda."
version = "Muestra la versión de Fabrewk."
json = "Da la salida como un solo documento JSON con un campo schema."

[command.status]
summary = "Muestra la salud del registro, la política vigente y el estado de cada etapa y tarea."
arg = "Una etapa o una tarea, por su identificador (s-… o t-…): la muestra con sus eventos."

[command.config]
summary = "Muestra cada ajuste efectivo con su origen, los cambios no adoptados, las llaves, lo que tiene este equipo y cada control."
arg = "Un solo ajuste, por su ruta de clave: muestra solo su valor y su origen."

[command.check]
summary = "Verifica los ajustes, la política, el registro, el dominio, las credenciales y la carpeta privada."

[reference]
title = "fabrewk: referencia de comandos"
intro = "Generada desde la declaración de comandos; lista exactamente los comandos que existen."
moves = "Movimientos que puede causar:"
none = "ninguno."
documents = "Documentos con --json:"
verifies = "Verifica"
codes = "Códigos"
control = "Control"
program = "El programa solo"
exits = "Estados de salida"

[exit]
0 = "hecho."
1 = "rechazado: se imprimió un código y no se escribió nada."
2 = "error de uso: no se aceptó la línea de comandos."
3 = "la verificación encontró un problema."
70 = "error interno."

[check]
C1 = "Los archivos de ajustes se leen y validan, y el de cada mantenedor tiene solo claves personales."
C2 = "Hay una política adoptada, y el archivo del proyecto es igual a ella o su cambio está pendiente."
C3 = "El registro se reproduce: versiones, resúmenes, forma canónica, cadenas, bifurcaciones, transiciones, firmas, identificadores."
C4 = "El registro existe y no ha retrocedido: efectivo donde se recorre la historia de Git, cooperativo en un solo equipo."
C8 = "Las entradas del dominio, los alias, su archivo de ignorados y la regla de ignorados del producto."
C9 = "Ningún archivo parece una credencial: una heurística."
C10 = "Los archivos del registro están confirmados donde el modo de publicación los confirma."
C11 = "La carpeta privada da acceso solo a su dueño."
finding = "{check} ({severity}, {control}): {about}"
passed = "La verificación pasó sin errores; advertencias: {warnings}."
failed = "La verificación encontró problemas; errores: {errors}, advertencias: {warnings}."

[severity]
error = "error"
warning = "advertencia"

[control]
effective = "efectivo"
cooperative = "cooperativo"

[status]
absent = "Aquí no hay registro: Fabrewk no está instalado en este repositorio, o esta no es su raíz."
broken = "El registro no se reproduce, así que no se puede leer ningún estado de él:"
replays = "El registro se reproduce: {streams} flujos, {events} eventos."
no-policy = "Aún no hay una política adoptada."
policy = "Política vigente: el archivo del proyecto adoptado, resumen {digest}."
adopted = "El archivo del proyecto es el adoptado."
pending = "El archivo del proyecto tiene cambios aún no adoptados."
pending-unknown = "El archivo del proyecto no se lee, así que no se pueden comparar sus cambios."
mode = "Modo de publicación: {mode}."
no-mode = "No hay un modo de publicación registrado."
no-stages = "No se ha propuesto ninguna etapa."
stage = "Etapa {id}, {state}: {goal}"
task = "Tarea {id}, {state}: {goal}"
in-stage = "En la etapa {stage}."
events = "Eventos, en orden:"
event = "{what} ({kind}), por {by}, el {at}"
allowed = "Movimientos que la tabla de transiciones permite desde aquí: {moves}."

[mode]
published = "publicado en el repositorio del producto"
