[actor]
person = "el mantenedor {alias} ({role})"
agent = "un agente ({tool})"
fabrewk = "Fabrewk"
extension = "la extensión {name}"

[config]
heading = "Configuración efectiva, de la política vigente (resumen {digest}); no aplica el archivo de ningún mantenedor, pues la llave de firma de Git no nombra a ninguno:"
heading-person = "Configuración efectiva, de la política vigente (resumen {digest}) y del archivo del mantenedor {alias}:"
unset = "declarado, sin valor"
pending = "Cambios en el archivo del proyecto aún no adoptados:"
keys = "Llaves de los mantenedores:"
key = "{alias}: una llave de tipo {kind}; toque obligatorio: {touch}"
machine = "Lo que tiene este equipo:"
absent = "ausente"
no-version = "no imprime versión"
never = "nunca"
tools = "Herramientas permitidas y presentes a la vez: {tools}."
none = "ninguna"
controls = "Controles, cada uno efectivo o cooperativo:"

[source]
default = "el valor predeterminado"
project = "la política vigente ({from})"
personal = "el archivo del mantenedor {from}"
stage = "la etapa {from}"
task = "la tarea {from}"
