resources = "Nada limita la memoria, los procesadores, los procesos o el disco que una celda escribe durante su ejecución: solo su tiempo y los bytes que se guardan de su salida."
host-names = "Dentro de una celda se ven nombres del anfitrión: las rutas de lo que se monta, que pueden llevar el nombre de la persona, y las descripciones y números de serie de las llaves del kernel."
key-serials = "El filtro rechaza las llamadas del llavero del kernel, los sockets criptográficos e io_uring; otra interfaz del kernel que tome el número de serie de una llave no se rechaza."
network-helper = "Si Fabrewk muere durante una ejecución, la celda termina con él, pero el pasta de la celda queda, inactivo, hasta que lo termine el siguiente comando que escribe."
tool-credential = "Un agente puede leer la credencial que usa su herramienta y, con una red de salida, enviarla fuera: solo el sandbox propio de la herramienta y sus reglas de permisos alejan de ella los comandos del modelo."
audit-limit = "La auditoría del stream de un revisor detecta una revisión floja o fallida, no una hostil: los comandos del propio modelo podrían imprimir lo que la auditoría lee."
tool-flags = "Las flags de la herramienta que apagan su descubrimiento de ajustes, archivos de instrucciones y plugins, y que arrancan su propio sandbox, son de la herramienta: Fabrewk comprueba con el preflight lo que puede y confía en el resto."

[source]
default = "el valor predeterminado"
project = "la política vigente ({from})"
personal = "el archivo del mantenedor {from}"
stage = "la etapa {from}"
task = "la tarea {from}"
declared = "declarado en machine.toml"

[effect]
widening = "amplía la autoridad"
narrowing = "reduce la autoridad"
neutral = "ni amplía ni reduce"

[touch]
yes = "sí"
unknown = "desconocido"

[space]
programs = "programa {name}"
tools = "herramienta {name}"
required = "herramienta requerida {name}"

[how]
observed = "{path}, {version}; encontrado en PATH; verificado por uso por última vez: {verified}"
declared = "{path}, {version}; declarado en machine.toml; verificado por uso por última vez: {verified}"

[setting]
"project.name" = "El nombre del proyecto"
"maintainers.*.role" = "El rol del mantenedor"
"maintainers.*.key" = "La llave de firma del mantenedor"
"maintainers.*.hostAccount" = "La cuenta del mantenedor en el servidor de Git"
"maintainers.*.area" = "El área de un supervisor; si falta, todo el proyecto"
"languages.canonicalDocumentationLanguage" = "El idioma de los archivos técnicos"
"languages.documentationLanguages" = "Los idiomas de publicación de la documentación"
"languages.codeLanguage" = "El idioma del código"
"languages.evidenceLanguage" = "El idioma de la evidencia"
"languages.delegationLanguage" = "El idioma de los paquetes delegados a agentes"
"languages.agentInteraction" = "El idioma en que los agentes responden a este mantenedor"
"languages.interfaceLanguage" = "El idioma de los mensajes de Fabrewk"
"maintainer.alias" = "El mantenedor de este archivo"
"environment.shell" = "La shell del mantenedor"
"tools.*.adapter" = "Qué módulo maneja la herramienta"
"tools.*.providers" = "Los proveedores que la herramienta puede usar"
"tools.*.path" = "Dónde está la herramienta, cuando la detección no la encuentra"
"providers.*.allowed" = "Si se puede enviar código al proveedor"
"models.*.provider" = "El proveedor del modelo"
"models.*.id" = "El nombre del modelo para su proveedor"
"models.*.efforts" = "Los esfuerzos del modelo"
"profiles.*.kind" = "El tipo de tarea del perfil"
"profiles.*.tool" = "La herramienta del perfil"
"profiles.*.model" = "El modelo del perfil"
"profiles.*.effort" = "El esfuerzo del perfil"
"profiles.*.checks" = "Las comprobaciones que corre el perfil"
"profiles.*.requiredTools" = "Las herramientas verificadas al iniciar el perfil"
"profiles.*.rounds" = "Las rondas de revisión del perfil"
"profiles.*.dispatches" = "Los despachos del perfil"
"profiles.*.minutes" = "Los minutos del perfil"
"profiles.*.tokens" = "Los tokens del perfil; si falta, sin límite"
"limits.rounds" = "Rondas de revisión predeterminadas"
"limits.dispatches" = "Despachos predeterminados"
"limits.minutes" = "Minutos predeterminados"
"limits.freeDiskMegabytes" = "Megabytes libres necesarios antes de cada copia"
"checks.*.command" = "El comando de la comprobación, sin shell"
"checks.*.network" = "Si la comprobación tiene red"
"checks.*.minutes" = "El límite de tiempo de la comprobación"
"checks.*.tools" = "Las herramientas que necesita la comprobación"
"review.differentProvider" = "Revisión por otro proveedor"
"gate.protectedPaths" = "Rutas que ninguna tarea puede tocar"
"gate.protectedNames" = "Nombres que un cambio alcanza, a cualquier profundidad, solo si están listados literalmente"
"git.signOff" = "Un sign-off en los commits de Fabrewk"
"extensions.*.digest" = "El resumen de la extensión"
"extensions.*.network" = "Si la extensión tiene red"
"extensions.*.minutes" = "El límite de tiempo de la extensión"

[code.AGENT_ENVIRONMENT]
reason = "Esto corre dentro de un agente o una extensión, cuyos marcadores están en el entorno, y solo una persona hace este movimiento. El control es cooperativo: un proceso puede limpiar su entorno."
next = "Ejecuta tú el comando, en tu propia terminal."

[code.ALIAS_INVALID]
reason = "Un nombre que no es un alias válido: minúsculas, dígitos y guiones sueltos, empezando con una letra, de 32 caracteres a lo más, y que no sea un nombre reservado."
next = "Renómbralo a un alias válido."

[code.ALIAS_MISMATCH]
reason = "El archivo personal nombra a otro mantenedor que su directorio."
next = "Haz que maintainer.alias sea igual al nombre del directorio del archivo."

[code.ATTEMPT_ENDED]
reason = "El registro termina un intento que no está abierto."
next = "Una persona examina el evento indicado; Fabrewk nunca repara el registro."
run = "fabrewk check"

[code.ATTEMPT_REPLACED]
reason = "El registro termina un intento que ya se terminó como desconocido y que otro posterior reemplazó."
next = "Una persona examina el evento indicado; Fabrewk nunca repara el registro."
run = "fabrewk check"

[code.BASE_MOVED]
reason = "El producto en la punta de la rama del registro no es el que dejaron la base de la tarea o la última integración de sus dependencias."
next = "La tarea no puede correr sobre un producto que se movió; un maestro lee su estado y la rechaza o la propone de nuevo:"
run = "fabrewk status"

[code.BUDGET_EXHAUSTED]
reason = "Los despachos, minutos o tokens de la tarea o de su etapa están gastados, o no se puede saber lo gastado; no se despacha nada más."
next = "La tarea espera a una persona: un maestro la autoriza otra vez, lo que concede de nuevo los límites de la tarea, o la rechaza."
run = "fabrewk status"

[code.CHECK_DUPLICATE]
reason = "Una comprobación tiene dos definiciones distintas."
next = "Deja una sola definición de la comprobación, en la etapa o en el proyecto."

[code.CHECK_UNKNOWN]
reason = "Una verificación no pudo correr, así que su resultado es desconocido, y un resultado desconocido nunca es un pase."
next = "Instala o repara lo indicado y verifica de nuevo."
run = "fabrewk check"

[code.CONFINEMENT_UNAVAILABLE]
reason = "Ningún agente corre sin confinamiento, y este equipo o esta versión no tiene un confinamiento que darle."
next = "Córrelo donde Fabrewk tenga un mecanismo de confinamiento; el detalle dice qué falta."

[code.CREDENTIAL_SUSPECTED]
reason = "Un archivo parece una credencial. La coincidencia es una heurística, un control cooperativo."
next = "Quita la credencial de donde se encontró, y reemplázala si alguna vez se confirmó o se compartió."

[code.DEPENDENCY_OPEN]
reason = "Una tarea de la que depende aún no está integrada."
next = "Primero lleva esa tarea a su fin:"
run = "fabrewk status"

[code.DISK_LOW]
reason = "El sistema de archivos que contiene .brewstillery/local/ tiene menos espacio libre que limits.freeDiskMegabytes, o no se puede leer su espacio libre."
next = "Libera espacio en ese disco, o baja limits.freeDiskMegabytes en los ajustes del proyecto."

[code.DOMAIN_NOT_IGNORED]
reason = "El repositorio del producto no ignora .brewstillery/, así que un commit ahí lo publicaría."
next = "Agrega la línea /.brewstillery/ al .git/info/exclude del producto."

[code.EVIDENCE_STALE]
reason = "La identidad de un check ya no coincide: cambió el árbol de producto del candidato, la definición del check, la política, la versión de una herramienta nombrada o la plataforma."
next = "Un maestro corre la tarea otra vez, lo que revalida su candidato, o la rechaza."
run = "fabrewk status"

[code.DOMAIN_UNKNOWN_ENTRY]
reason = "Una entrada en .brewstillery/ que no es parte del dominio de Fabrewk; se dejó como está."
next = "Sácala de .brewstillery/ si no es de Fabrewk."

[code.GITIGNORE_CHANGED]
reason = "El archivo .brewstillery/.gitignore difiere de lo que Fabrewk escribe."
next = "Restáuralo a la sola línea local/."

[code.BOOTSTRAP_CHANGED]
reason = "El contenido de bootstrap/ difiere de la importación. Este directorio es de solo lectura después de importar."
next = "Restaura bootstrap/ desde Git al estado que tenía al importar y elimina las entradas agregadas."

[code.HEAD_DETACHED]
reason = "El head de Git no nombra ninguna rama, así que no hay rama del registro."
next = "Cambia a la rama que guarda el registro y corre el comando de nuevo."

[code.KEY_UNKNOWN]
reason = "Ningún ajuste está declarado en esta ruta de clave."
next = "Consulta cada ajuste y su ruta de clave:"
run = "fabrewk config"

[code.LANE_VIOLATION]
reason = "La copia del agente cambia un archivo fuera de los archivos permitidos de la tarea, una ruta que no es texto válido, o deja una entrada que no es un archivo, un enlace ni un directorio."
next = "Lee lo que cambió el agente; autoriza la tarea de nuevo con archivos permitidos más amplios, o recházala."

[code.LIMIT_UNOBSERVABLE]
reason = "Hay un límite de tokens para una herramienta que no informa los tokens que usa, así que el límite no se podría cumplir."
next = "Quita el límite de tokens, o usa un perfil cuya herramienta informe tokens."

[code.LOCK_HELD]
reason = "Otro comando de Fabrewk tiene el candado del registro de este repositorio, u otra tarea está en ejecución: un escritor y una ejecución a la vez."
next = "Espera a que termine y corre tu comando de nuevo."

[code.MARK_INVALID]
reason = "La marca del registro de este equipo (local/cache/heads.json) está dañada o nombra un evento que el registro no tiene en ese lugar."
next = "Una persona examina la marca y la quita si está dañada; Fabrewk nunca la quita."

[code.MERGE_IN_PROGRESS]
reason = "El candidato actual de la tarea está aceptado, y su integración puede estar a medias."
next = "Termina la integración, o consulta dónde está la tarea:"
run = "fabrewk status"

[code.MOVE_NOT_ALLOWED]
reason = "La tabla de transiciones no permite este movimiento desde el estado del sujeto."
next = "Consulta el estado del sujeto y los movimientos que permite:"
run = "fabrewk status"

[code.NOT_A_REPOSITORY]
reason = "Esta no es la raíz del árbol de trabajo principal del repositorio."
next = "Córrelo en la raíz del árbol de trabajo principal del repositorio."

[code.NO_PROGRESS]
reason = "Dos rondas seguidas no bajaron el número de hallazgos bloqueantes confirmados."
next = "La tarea espera a una persona, que elige una alternativa: reducir el alcance, cambiar el diseño o reemplazar un componente; después autoriza una tarea otra vez o rechaza esta."
run = "fabrewk status"

[code.OUTCOME_UNKNOWN]
reason = "El proceso que corría el intento de la tarea ya no corre, así que su resultado es desconocido; el intento cuenta como gastado, y reintentar gasta un despacho."
next = "La tarea espera a una persona: un maestro la autoriza otra vez o la rechaza."
run = "fabrewk status"

[code.PLAN_CHANGED]
reason = "El plan que assess da ahora, con estas opciones, no es el nombrado, o cambió un archivo que el plan escribe: aplicarlo escribiría sobre lo que no viste."
next = "Evalúa otra vez con las mismas opciones, lee el plan y aplica el digest que imprime:"
run = "fabrewk assess"

[code.VERDICT_NONE]
reason = "El veredicto del plan es none: lo bloquea una de las razones que da."
next = "Resuelve las razones que bloquean y evalúa otra vez:"
run = "fabrewk assess"

[code.MODE_NOT_AVAILABLE]
reason = "El modo de revisión aún no está construido, así que un plan para él no se puede aplicar."
next = "Evalúa para administrar:"
run = "fabrewk assess --mode adopt"

[code.INSTALLATION_INCOMPLETE]
reason = "Aquí empezó un apply que no terminó, así que ningún otro comando puede escribir hasta que termine."
next = "Ejecuta otra vez el mismo apply, con el mismo digest y las mismas opciones: termina lo que falta."

[code.POLICY_ABSENT]
reason = "No hay una política adoptada, así que no hay configuración efectiva ni mantenedores."
next = "Un maestro adopta el archivo del proyecto; instalar Fabrewk lo hace primero."

[code.POLICY_PENDING]
reason = "El archivo del proyecto tiene cambios que ningún maestro ha adoptado; la política vigente sigue siendo la adoptada."
next = "Consulta los cambios y lo que cada uno hace a la autoridad:"
run = "fabrewk config"

[code.POLICY_UNCOMMITTED]
reason = "El archivo del proyecto no está como se confirmó en el head de la rama del registro."
next = "Confirma .brewstillery/settings.toml y luego adóptalo."
run = "fabrewk adopt"

[code.PRIVATE_FOLDER_INCLUDED]
reason = "La configuración de Git nombra un archivo de la carpeta privada de Fabrewk, un include o su archivo de atributos, que Git abriría: assess se detiene antes de ejecutar cualquier otro Git."
next = "Quita ese ajuste de la configuración de Git, o apúntalo fuera de la carpeta privada; después evalúa de nuevo:"
run = "fabrewk assess"

[code.PRIVATE_FOLDER_PERMISSIONS]
reason = "La carpeta privada da acceso a alguien más que su dueño, así que Fabrewk no la lee."
next = "Deja la carpeta solo para su dueño (modo 0700)."

[code.PROVIDER_MISSING]
reason = "review.differentProvider es require, y el proveedor del perfil de revisión es el del constructor, o su herramienta no está."
next = "La tarea espera a una persona: un maestro la autoriza otra vez nombrando --widen review.differentProvider, lo que registra la limitación, o la rechaza."
run = "fabrewk status"

[code.PROTECTED_PATH]
reason = "Los archivos permitidos, o la copia del agente, alcanzan una ruta protegida (.git o .brewstillery)."
next = "Reduce los archivos permitidos para que no alcancen ninguna ruta protegida."

[code.PROTECTED_PATH_WILDCARD]
reason = "Un comodín entre los archivos permitidos coincide con una ruta o un nombre protegidos."
next = "Lista el archivo protegido literalmente, o reduce el comodín."

[code.RECORD_ABSENT]
reason = "Aquí no hay registro."
next = "Córrelo en la raíz de un repositorio donde Fabrewk esté instalado."

[code.RECORD_BROKEN]
reason = "El registro está roto: sus archivos no forman una sola cadena sin cortes."
next = "Una persona examina el archivo indicado y lo restaura desde la historia; Fabrewk nunca repara el registro."

[code.RECORD_COMMIT_RACE]
reason = "La rama se movió mientras Fabrewk confirmaba el registro; sus eventos están escritos pero no confirmados."
next = "El siguiente comando que escribe los confirma."

[code.RECORD_DIGEST_MISMATCH]
reason = "El contenido de un archivo de evento no es el que su nombre registra."
next = "Una persona examina el archivo indicado y lo restaura desde la historia."

[code.RECORD_FORK]
reason = "Dos eventos ocupan el mismo lugar de un flujo: dos clones escribieron ahí."
next = "Una persona decide qué línea de eventos se queda y la restaura desde la historia."

[code.RECORD_HEAD_MOVED]
reason = "Algo escribió en el registro sin su candado mientras corría este comando; este comando no escribió nada."
next = "Corre el comando de nuevo."

[code.RECORD_ID_COLLISION]
reason = "Dos etapas o dos tareas recibieron el mismo identificador."
next = "Una persona examina el flujo indicado."

[code.RECORD_NONCANONICAL]
reason = "Un archivo de evento no está en forma canónica, así que no se puede confiar en su resumen."
next = "Una persona examina el archivo indicado y lo restaura desde la historia."

[code.RECORD_ROLLBACK]
reason = "El registro perdió eventos que tenía antes: un retroceso."
next = "Una persona restaura los eventos perdidos desde la historia o desde otro clon."

[code.RECORD_SIGNATURE_INVALID]
reason = "El evento de una persona no está firmado con la llave y el rol que la política da a quien firma."
next = "Una persona examina el evento indicado; un evento que nadie firmó no es de nadie."

[code.RECORD_TRANSITION_INVALID]
reason = "Un evento está donde la tabla de transiciones no lo permite."
next = "Una persona examina el evento indicado."
run = "fabrewk check"

[code.RECORD_UNCOMMITTED]
reason = "Algunos archivos del registro no están confirmados en la rama del registro."
next = "El siguiente comando que escribe los confirma."

[code.RECORD_VERSION_UNKNOWN]
reason = "Un evento no es de un esquema que esta versión de Fabrewk conozca."
next = "Usa una versión de Fabrewk que lo conozca, o examina el archivo indicado."

[code.REVIEW_UNEXAMINED]
reason = "El flujo del revisor no muestra que examinara el candidato, o no se puede leer; su veredicto no cuenta."
next = "La tarea espera a una persona: un maestro la autoriza otra vez o la rechaza. Mira la evidencia de la revisión:"
run = "fabrewk status"

[code.REVIEW_INVALID]
reason = "El resultado del revisor no se ajusta al esquema de la revisión: su veredicto no es accept ni reject, un hallazgo no tiene severidad, estado o resumen, o un reject no tiene ningún hallazgo bloqueante confirmado."
next = "La tarea espera a una persona; mira lo que devolvió el revisor:"
run = "fabrewk status"

[code.ROUNDS_EXHAUSTED]
reason = "Las rondas de revisión de la tarea desde su autorización están gastadas; no se empieza ninguna ronda más."
next = "La tarea espera a una persona: un maestro la autoriza otra vez, lo que concede de nuevo sus rondas, o la rechaza."
run = "fabrewk status"

[code.ROLE_FORBIDDEN]
reason = "La llave que firma este movimiento no tiene en la política ningún rol que pueda hacerlo."
next = "Un maestro hace este movimiento con su propia llave."

[code.ROLE_NOT_ENFORCED]
reason = "La política lista un supervisor, un rol que Fabrewk aún no hace cumplir."
next = "Dale a ese mantenedor el rol de maestro o de colaborador."

[code.SETTINGS_INVALID]
reason = "Un archivo de ajustes no se lee o no valida."
next = "Corrige el archivo en la ruta de clave y la línea indicadas."

[code.SETTINGS_KEY_NOT_PERSONAL]
reason = "Un archivo personal tiene una clave que solo el archivo del proyecto puede fijar."
next = "Mueve la clave al archivo del proyecto, donde un maestro la adopta."

[code.STAGE_OPEN_TASKS]
reason = "Una tarea de la etapa no ha terminado: no está ni integrada ni rechazada."
next = "Mira la etapa y sus tareas:"
run = "fabrewk status"

[code.SWEEP_MISSING]
reason = "El fermento de un mantenedor no se barrió después de que terminó la última tarea de la etapa."
next = "El integrador barre cada fermento nombrado, con el comando sweep; mira cómo está todo:"
run = "fabrewk status"

[code.VIEW_STALE]
reason = "Una vista generada difiere de lo que da el registro, o falta: se cambió a mano."
next = "El siguiente comando que escribe la regenera; para ver qué difiere, compárala con su versión en Git."

[code.STAGE_CLOSED]
reason = "La etapa está cerrada, así que no se le puede agregar ninguna tarea."
next = "Propón las tareas en una etapa nueva."

[code.TASK_CHANGED]
reason = "La tarea, o el head de su flujo, cambió después de mostrarse."
next = "Consulta la tarea como está ahora:"
run = "fabrewk status"

[code.TASK_INVALID]
reason = "Los campos de una etapa o de una tarea no son válidos."
next = "Corrige el campo indicado."

[code.TERMINAL_REQUIRED]
reason = "No hay una terminal donde hacer las preguntas, así que onboard no pregunta nada ni escribe nada."
next = "Córrelo en una terminal, o toma la ruta del agente: assess con las respuestas como opciones, que no escribe nada:"
run = "fabrewk assess"

[code.TOOL_FAILED]
reason = "Una herramienta externa falló; lo que imprimió se guarda como evidencia y nunca se muestra aquí."
next = "Repara lo indicado y corre el comando de nuevo."

[code.TOOL_MISSING]
reason = "Una herramienta que esto necesita no está en este equipo."
next = "Instala la herramienta indicada, o declara dónde está."

[code.WORKTREE_DIRTY]
reason = "Un archivo que la integración escribiría no tiene, en el árbol de trabajo ni en el índice, ni el contenido de la base ni el del candidato: una edición de la persona, que nunca se sobrescribe."
next = "Confirma, mueve o deshaz esa edición, y luego corre la tarea otra vez, lo que termina su integración."
run = "fabrewk status"

[code.WIDENING_UNNAMED]
reason = "Un cambio amplía la autoridad sin nombrarse."
next = "Un maestro nombra cada ampliación, por su ruta de clave, al hacer el movimiento."

[code.WORDS_COPIED]
reason = "Las palabras dadas son el ejemplo que imprime la ayuda, no las tuyas."
next = "Escribe tus propias palabras para esta decisión con --say."

[code.WORDS_MISSING]
reason = "Un movimiento de persona necesita tus propias palabras, dadas con --say: no vacías y en texto UTF-8 válido."
next = "Di con --say, con tus palabras, por qué lo decides."

[command.sweep]
summary = "Registra la respuesta del integrador al fermento de un mantenedor: lo que recomienda y las ediciones que redacta, y escribe la respuesta debajo del separador."
arg = "El mantenedor, por su alias."

[command.discard]
summary = "Un maestro descarta una propuesta pendiente, diciendo por qué."
arg = "La propuesta, por su identificador (p-…)."

[command.approve]
summary = "Un maestro aprueba una propuesta, que aplica su edición y hace commit del alambique o de la fórmula solos, o aprueba el alambique o la fórmula como están, diciendo por qué."
arg = "Una propuesta, por su identificador (p-…), o la palabra alambique o formula."

[command.import]
summary = "Registra como primera aprobación de la fórmula el commit firmado de un maestro que cambia solo FORMULA.md, una vez que Git lo verifica contra la llave de un maestro de la política vigente; no pide palabras ni hace una firma nueva."
arg = "El commit, como Git lo nombra."

[command.cut]
summary = "Registra el corte de la fórmula aprobada que abre el integrador, o con --report el corte en curso terminado, para la auditoría del maestro; no autoriza nada."
arg = "El corte, por el identificador que da su título en FORMULA.md (como 1a)."

[import]
done = "Se importó la primera aprobación de la fórmula: el commit {commit}, firmado por el maestro {alias}; la fórmula aprobada es {digest}."

[cut]
opened = "Se abrió el corte {id} de la fórmula, {title} ({phase})."
reported = "Se reportó terminado el corte {id} de la fórmula, {title}: espera la auditoría del maestro, en el chat o en el fermento."

[sweep]
done = "Se barrió el fermento de {alias}: {points} puntos respondidos, {recorded} propuestas registradas, {withdrawn} retiradas."

[discard]
done = "Se descartó la propuesta {id}. La respuesta del fermento lo muestra en el siguiente barrido."

[approve]
alambique = "Se aprobó la propuesta {id}: el alambique es ahora {digest}."
rules = "Se aprobó la propuesta {id}: las reglas del proyecto son ahora {digest}. RULES.md se sigue con las vistas."
direct = "Se aprobó la edición directa del alambique: es ahora {digest}."
baseline = "Se registró la base del alambique: {digest}."
