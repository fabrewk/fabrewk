[package]
name = "fabrewk-core"
description = "Fabrewk's core: the record, settings, identity, transitions and checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Approved runtime crates (AD-4, D-036): event files and digests. No derive: events are read as `serde_json::Value`
# and validated by hand, so the release build carries no procedural macro.
serde_json = "1"
# Its traits only, already in the release build through `serde_json` (D-036): to read a stream's JSON refusing a
# member named twice (part 9d, P9D-1).
serde = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11"
# Settings (AD-2, D-036), read as spanned tables so every refusal names its line; TOML 1.1, no `serde` (D-048).
toml = { version = "1.2", default-features = false, features = ["std", "parse"] }
# The command line (section 9 item 3, D-040): a lexer only, so the one declaration of commands stays Fabrewk's own.
lexopt = "0.3"

[dev-dependencies]
# Property tests (choice 11 of the core specification, D-040); never shipped.
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# Stops the process at a chosen write, for the crash suite (core-specification 11.5); never in a release build.
fault-injection = []

[[test]]
name = "crash"
required-features = ["fault-injection"]
