# Fabrewk project settings for this repository (bootstrap).
#
# Project-wide values. A maintainer's personal file (.brewstillery/<alias>/settings.toml)
# never overrides what grants authority here: permissions, acceptance criteria, providers
# or limits. Active keys are decisions recorded in .brewstillery/bootstrap/decisions.md;
# commented keys are proposals, not decisions.

[project]
name = "Fabrewk"            # alambique, section 1 (decided 2026-11-02)
command = "fabrewk"         # alambique, section 6, command point; commands and flags in English
domain = ".brewstillery"    # alambique, section 2: the only Fabrewk directory in a repository

[maintainers]
aliases = ["xel"]           # each alias has .brewstillery/<alias>/ with fermento.md and settings.toml

[layout]
# Names an alias may not take, because they belong to .brewstillery/ itself (alambique, section 2).
reservedNames = ["bootstrap", "data", "local", "settings.toml", "STATUS.md", "ALAMBIQUE.md", "RULES.md", ".gitignore"]

[languages]
canonicalDocumentationLanguage = "en"
documentationLanguages = ["en", "es-MX"]
